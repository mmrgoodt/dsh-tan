<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tan · 记忆控制台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d1117; --side:#0a0e14; --card:#161b22; --card2:#1c222b;
    --bd:#30363d; --tx:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --gold:#f5c850; --red:#f85149; --orange:#d29922; --purple:#bc8cff;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font:13px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;height:100vh}

  /* ---------- 侧栏 ---------- */
  .side{width:196px;flex:0 0 196px;background:var(--side);border-right:1px solid var(--bd);
        display:flex;flex-direction:column;padding:16px 10px}
  .brand{display:flex;align-items:center;gap:9px;padding:0 8px 18px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#58a6ff,#bc8cff);
        display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .brand b{font-size:14px}
  .brand small{display:block;font-size:10px;color:var(--dim2);font-weight:400}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;color:var(--dim);
         text-decoration:none;font-size:12.5px;cursor:pointer;transition:.14s}
  .nav a:hover{background:#141a22;color:var(--tx)}
  .nav a.on{background:#1a2230;color:var(--tx);font-weight:600}
  .nav a.on::before{content:"";position:absolute;left:0;width:3px;height:18px;background:var(--blue);border-radius:0 3px 3px 0}
  .nav a{position:relative}
  .nav .ico{width:16px;text-align:center;font-size:13px}
  .side-foot{margin-top:auto;font-size:10.5px;color:var(--dim2);padding:10px 8px;line-height:1.6}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;
       box-shadow:0 0 7px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 7px var(--red)}

  /* ---------- 主区 ---------- */
  .main{flex:1;overflow-y:auto;padding:24px 30px 60px}
  .h1{font-size:19px;font-weight:700;margin-bottom:4px}
  .sub{font-size:12px;color:var(--dim);margin-bottom:22px}

  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:14px 16px;
        flex:1 1 130px;min-width:120px}
  .card .k{font-size:11px;color:var(--dim);margin-bottom:7px}
  .card .v{font-size:24px;font-weight:700;line-height:1.1}
  .card .s{font-size:10.5px;color:var(--dim2);margin-top:5px}

  .panel{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:16px 18px;margin-bottom:18px}
  .panel > h3{font-size:13px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .panel > h3 .badge{font-size:10px;font-weight:400;color:var(--dim);background:#0d1117;
                     padding:2px 7px;border-radius:10px;border:1px solid var(--bd)}

  .layerbar{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;background:#0d1117;border:1px solid var(--bd);
        border-radius:7px;padding:6px 11px;font-size:11.5px}
  .chip i{width:8px;height:8px;border-radius:4px;display:inline-block}
  .chip b{font-weight:700}

  /* ---------- 列表 ---------- */
  .tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  input[type=text],select{background:#0d1117;border:1px solid var(--bd);border-radius:7px;
        color:var(--tx);padding:7px 11px;font-size:12px;outline:none;font-family:inherit}
  input[type=text]:focus,select:focus{border-color:var(--blue)}
  input[type=text]{flex:1;min-width:160px}
  button{background:#21262d;border:1px solid var(--bd);border-radius:7px;color:var(--tx);
         padding:7px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.14s}
  button:hover{background:#2d333b}
  button.pri{background:#238636;border-color:#2ea043;color:#fff;font-weight:600}
  button.pri:hover{background:#2ea043}
  button.danger{color:var(--red)}
  button.sm{padding:4px 9px;font-size:11px}

  .item{border:1px solid var(--bd);border-radius:9px;padding:11px 13px;margin-bottom:8px;
        background:var(--card2);transition:.14s}
  .item:hover{border-color:#3d4450}
  .item .top{display:flex;align-items:flex-start;gap:9px}
  .item .lh{width:3px;border-radius:2px;flex:0 0 3px;align-self:stretch;min-height:34px}
  .item .body{flex:1;min-width:0}
  .item .txt{font-size:12.5px;line-height:1.5;margin-bottom:5px;word-break:break-word}
  .item .meta{font-size:10.5px;color:var(--dim2);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .tag{font-size:9.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--bd);color:var(--dim)}
  .acts{display:flex;gap:5px;flex:0 0 auto;opacity:0;transition:.14s}
  .item:hover .acts{opacity:1}

  /* ---------- 表单 ---------- */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .field .hint{font-size:10.5px;color:var(--dim2);margin-top:5px}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .val{font-size:13px;font-weight:700;color:var(--blue);float:right}
  textarea{width:100%;background:#0d1117;border:1px solid var(--bd);border-radius:7px;color:var(--tx);
           padding:9px 11px;font:12px/1.6 inherit;resize:vertical;min-height:64px;outline:none}
  textarea:focus{border-color:var(--blue)}

  .row{display:flex;gap:16px;flex-wrap:wrap}
  .row > .field{flex:1 1 240px}

  .toast{position:fixed;right:22px;bottom:22px;background:#1f6feb;color:#fff;padding:11px 18px;
         border-radius:9px;font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.5);
         opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:none}
  .toast.err{background:#b62324}

  .empty{text-align:center;color:var(--dim2);padding:34px;font-size:12px}
  .offline{text-align:center;padding:60px 20px}
  .offline h2{font-size:17px;color:var(--red);margin-bottom:14px}
  .offline code{background:var(--card);padding:4px 10px;border-radius:5px;color:var(--blue);font-size:12.5px}
  .offline p{color:var(--dim);font-size:12.5px;line-height:2;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">记</div>
      <div><b>Tan</b><small>记忆控制台</small></div>
    </div>
    <nav class="nav" id="nav">
      <a data-v="overview" class="on"><span class="ico">◈</span>概览</a>
      <a data-v="memory"><span class="ico">▤</span>记忆</a>
      <a data-v="persona"><span class="ico">☺</span>人格</a>
      <a data-v="params"><span class="ico">⚙</span>参数</a>
      <a data-v="loops"><span class="ico">◎</span>未闭合</a>
      <a data-v="backup"><span class="ico">⇅</span>备份</a>
      <a data-v="visual"><span class="ico">✦</span>可视化</a>
    </nav>
    <div class="side-foot">
      <span class="dot" id="sdot"></span><span id="sstate">连接中…</span><br>
      <span id="sdb" style="word-break:break-all"></span>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const API = location.origin.replace(/\/$/, "");

/* ---------- token ---------- */
let TAN_TOKEN = (function () {
  // 1) URL 里带 ?token=xxx → 存起来并从地址栏抹掉
  try {
    const u = new URL(location.href);
    const t = u.searchParams.get("token");
    if (t) {
      localStorage.setItem("tan_token", t);
      u.searchParams.delete("token");
      history.replaceState(null, "", u.toString());
      return t;
    }
  } catch (e) {}
  // 2) 之前存过
  return localStorage.getItem("tan_token") || "";
})();

function setToken(t) {
  TAN_TOKEN = t || "";
  if (TAN_TOKEN) localStorage.setItem("tan_token", TAN_TOKEN);
  else localStorage.removeItem("tan_token");
}

/* 带 token 的 fetch 头 */
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (TAN_TOKEN) h["Authorization"] = "Bearer " + TAN_TOKEN;
  return h;
}

/* 弹一个输入 token 的遮罩 */
function askToken() {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;" +
      "display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)";
    mask.innerHTML = `
      <div style="background:#0d1117;border:1px solid #30363d;border-radius:14px;padding:26px 30px;width:420px;
                  box-shadow:0 20px 60px rgba(0,0,0,.6)">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">需要访问令牌</div>
        <div style="font-size:12px;opacity:.55;line-height:1.8;margin-bottom:16px">
          令牌在 <code style="background:#161b22;padding:2px 7px;border-radius:4px">~/.dsh/tan/token.txt</code><br>
          复制里面的内容粘到下面，只需一次
        </div>
        <input id="tk" type="text" placeholder="粘贴 token…"
               style="width:100%;box-sizing:border-box;background:#161b22;border:1px solid #30363d;
                      border-radius:8px;padding:10px 13px;color:#e6edf3;font-size:13px;outline:none;
                      font-family:ui-monospace,monospace">
        <div id="tkerr" style="color:#f85149;font-size:11.5px;margin-top:8px;min-height:16px"></div>
        <div style="display:flex;gap:9px;margin-top:14px">
          <button id="tkok" style="flex:1;padding:9px;border-radius:8px;border:1px solid #2ea043;
                  background:#238636;color:#fff;font-size:13px;font-weight:600;cursor:pointer">确认</button>
        </div>
      </div>`;
    document.body.appendChild(mask);
    const inp = mask.querySelector("#tk");
    const err = mask.querySelector("#tkerr");
    const ok = async () => {
      const v = (inp.value || "").trim();
      if (!v) { err.textContent = "先粘一个 token 进来"; return; }
      try {
        const r = await fetch(API + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: v }),
        });
        const j = await r.json();
        if (j.ok) {
          setToken(v);
          mask.remove();
          resolve(true);
        } else {
          err.textContent = "token 不对，再检查一下";
        }
      } catch (e) {
        err.textContent = "连不上服务";
      }
    };
    mask.querySelector("#tkok").onclick = ok;
    inp.onkeydown = (e) => { if (e.key === "Enter") ok(); };
    setTimeout(() => inp.focus(), 50);
  });
}
const $ = (s) => document.querySelector(s);
const main = $("#main");

const LAYER = {
  L4: { n: "身份", c: "var(--gold)" },
  L5: { n: "自我", c: "var(--gold)" },
  L3: { n: "方法", c: "var(--green)" },
  L2: { n: "事实", c: "var(--blue)" },
  "L2-": { n: "教训", c: "var(--red)" },
  L1: { n: "情景", c: "var(--orange)" },
};
const KIND = { promise: "答应", paused: "搁置", failed: "没成", todo: "待办", known_issue: "已知" };

let toastTimer = null;
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast on" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast"), 2600);
}

async function api(path, opts) {
  // 每次请求独立开 AbortController。
  // 之前是复用同一个：用户输 token 花 10 秒，6 秒的超时已经把 signal
  // abort 了，登录成功后重试的那次请求直接被打死 → 界面「没反应」。
  const attempt = async () => {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 15000);
    try {
      const o = Object.assign({ signal: ac.signal }, opts || {});
      o.headers = authHeaders(o.headers);
      const r = await fetch(API + path, o);
      if (r.status === 401) return { needAuth: true };
      if (!r.ok) throw new Error("HTTP " + r.status);
      return { data: await r.json() };
    } catch (e) {
      if (e.name === "AbortError") throw new Error("请求超时（服务没响应）");
      throw e;
    } finally { clearTimeout(timer); }
  };

  let res = await attempt();
  if (res.needAuth) {
    const got = await askToken();
    if (!got) throw new Error("需要 token");
    res = await attempt();          // 全新的一次请求，带新 token
    if (res.needAuth) throw new Error("token 无效");
  }
  return res.data;
}
const post = (p, body) => api(p, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function days(d) { return d < 1 ? "今天" : d < 2 ? "昨天" : d < 8 ? d + " 天前" : d < 31 ? "上个月" : "很久以前"; }

/* ============ 路由 ============ */
let view = "overview";
document.querySelectorAll("#nav a").forEach((a) => {
  a.onclick = () => {
    document.querySelectorAll("#nav a").forEach((x) => x.classList.remove("on"));
    a.classList.add("on");
    view = a.dataset.v;
    render();
  };
});

async function render() {
  try {
    if (view === "overview") await viewOverview();
    else if (view === "memory") await viewMemory();
    else if (view === "persona") await viewPersona();
    else if (view === "params") await viewParams();
    else if (view === "loops") await viewLoops();
    else if (view === "backup") await viewBackup();
    else if (view === "visual") await viewVisual();
    $("#sdot").className = "dot";
    $("#sstate").textContent = "已连接";
  } catch (e) {
    $("#sdot").className = "dot off";
    $("#sstate").textContent = "未连接";
    main.innerHTML = `
      <div class="offline">
        <h2>记忆服务未启动</h2>
        <code>python api.py</code>
        <p>或者双击 D:\\dsh-tan\\启动记忆服务.bat<br>
           服务起来后刷新这个页面</p>
      </div>`;
  }
}

/* ============ 概览 ============ */
async function viewOverview() {
  const [st, gr] = await Promise.all([api("/status"), api("/graph")]);
  $("#sdb").textContent = (st.db_path || "").split("\\").pop();
  const p = st.persona || {};
  const layers = Object.entries(st.by_layer || {});

  main.innerHTML = `
    <div class="h1">概览</div>
    <div class="sub">记忆库：${esc(st.db_path || "")}</div>

    <div class="cards">
      <div class="card"><div class="k">记忆</div><div class="v" style="color:var(--blue)">${st.memories}</div>
        <div class="s">${gr.nodes.length} 个活跃节点</div></div>
      <div class="card"><div class="k">Thread</div><div class="v" style="color:var(--green)">${st.threads}</div>
        <div class="s">按「事」组织</div></div>
      <div class="card"><div class="k">未闭合</div>
        <div class="v" style="color:${st.open_loops ? "var(--gold)" : "var(--dim2)"}">${st.open_loops}</div>
        <div class="s">${st.open_loops ? "有话要跟你说" : "都做完了"}</div></div>
      <div class="card"><div class="k">人格</div>
        <div class="v" style="color:var(--purple);font-size:19px">${esc(p.stage || "初识")}</div>
        <div class="s">聊过 ${p.turns || 0} 轮</div></div>
    </div>

    <div class="panel">
      <h3>分层分布</h3>
      <div class="layerbar">
        ${layers.length ? layers.map(([l, n]) =>
          `<div class="chip"><i style="background:${(LAYER[l] || {}).c || "var(--dim)"}"></i>
           ${esc((LAYER[l] || {}).n || l)} <b style="color:${(LAYER[l] || {}).c || "var(--tx)"}">${n}</b></div>`
        ).join("") : `<div class="empty">还没有记忆</div>`}
      </div>
    </div>

    <div class="panel">
      <h3>快捷操作</h3>
      <div class="tools">
        <button class="pri" onclick="location.hash='#memory';document.querySelector('[data-v=memory]').click()">浏览记忆</button>
        <button onclick="runGold()">跑黄金测试</button>
        <button onclick="doSweep()">清理一次</button>
        <button onclick="window.open('neuron3d.html','_blank')">打开 3D 图</button>
      </div>
    </div>
  `;
}

window.runGold = async () => {
  toast("测试中…");
  try {
    const r = await post("/gold");
    toast(`黄金测试：${r.passed}/${r.total}（${r.score}%）`, !r.healthy);
  } catch (e) { toast("失败：" + e.message, true); }
};
window.doSweep = async () => {
  try {
    const r = await post("/sweep");
    toast(`清理完成：归档噪音 ${r.archived_noise}，沉降 ${r.dormant}，瘦身 ${r.trimmed}`);
  } catch (e) { toast("失败：" + e.message, true); }
};

/* ============ 记忆 ============ */
let memFilter = { layer: "", q: "", status: "active" };

async function viewMemory() {
  const qs = new URLSearchParams();
  if (memFilter.layer) qs.set("layer", memFilter.layer);
  if (memFilter.q) qs.set("q", memFilter.q);
  qs.set("status", memFilter.status);
  const d = await api("/memories?" + qs.toString());

  main.innerHTML = `
    <div class="h1">记忆（${d.total}）</div>
    <div class="sub">这是它记得的一切。可以钉住、遗忘、手动强化。</div>

    <div class="tools">
      <input type="text" id="q" placeholder="搜索内容…" value="${esc(memFilter.q)}">
      <select id="ly">
        <option value="">全部层</option>
        ${Object.entries(LAYER).map(([k, v]) =>
          `<option value="${k}" ${memFilter.layer === k ? "selected" : ""}>${v.n}</option>`).join("")}
      </select>
      <select id="stt">
        <option value="active" ${memFilter.status === "active" ? "selected" : ""}>活跃</option>
        <option value="dormant" ${memFilter.status === "dormant" ? "selected" : ""}>沉睡</option>
        <option value="archived" ${memFilter.status === "archived" ? "selected" : ""}>归档</option>
      </select>
      <button class="pri" id="btnSearch">搜索</button>
    </div>

    <div id="list">
      ${d.memories.length ? d.memories.map((m) => memItem(m)).join("") :
        `<div class="empty">没有匹配的记忆</div>`}
    </div>
  `;

  $("#btnSearch").onclick = () => {
    memFilter.q = $("#q").value.trim();
    memFilter.layer = $("#ly").value;
    memFilter.status = $("#stt").value;
    render();
  };
  $("#q").onkeydown = (e) => { if (e.key === "Enter") $("#btnSearch").click(); };

  main.querySelectorAll("[data-act]").forEach((b) => {
    b.onclick = () => memAction(b.dataset.act, b.dataset.id, b.dataset.val === "1");
  });
}

function memItem(m) {
  const L = LAYER[m.layer] || { n: m.layer, c: "var(--dim)" };
  return `
    <div class="item">
      <div class="top">
        <div class="lh" style="background:${L.c}"></div>
        <div class="body">
          <div class="txt">${esc(m.summary || m.content)}</div>
          <div class="meta">
            <span class="tag" style="color:${L.c};border-color:${L.c}">${L.n}</span>
            <span>${days(m.age_days)}</span>
            <span>用过 ${m.recall_count} 次</span>
            <span>半衰期 ${Math.round(m.half_life)}d</span>
            ${m.pinned ? '<span class="tag" style="color:var(--gold);border-color:var(--gold)">已钉住</span>' : ""}
            ${m.protected ? '<span class="tag">免衰减</span>' : ""}
            ${m.reject_count ? `<span class="tag" style="color:var(--red)">被否 ${m.reject_count}</span>` : ""}
          </div>
        </div>
        <div class="acts">
          <button class="sm" data-act="edit" data-id="${m.id}">编辑</button>
          <button class="sm" data-act="pin" data-id="${m.id}" data-val="${m.pinned ? 0 : 1}">${m.pinned ? "取消钉" : "钉住"}</button>
          <button class="sm" data-act="reinforce" data-id="${m.id}">强化</button>
          <button class="sm danger" data-act="forget" data-id="${m.id}">遗忘</button>
        </div>
      </div>
    </div>`;
}

window.memAction = async (act, id, val) => {
  try {
    if (act === "edit") {
      const cur = document.querySelector(`[data-act="edit"][data-id="${id}"]`)
        .closest(".item").querySelector(".txt").textContent;
      const nv = prompt("修改内容：", cur);
      if (nv == null || nv.trim() === cur.trim()) return;
      await post("/memory/edit", { id, content: nv.trim() });
      toast("已保存修改");
      render();
      return;
    }
    if (act === "pin") await post("/memory/pin", { id, value: val });
    else if (act === "reinforce") await post("/memory/reinforce", { id });
    else if (act === "forget") {
      if (!confirm("遗忘这条记忆？（会转入沉睡，仍可查，但不再主动注入）")) return;
      await post("/memory/forget", { id, mode: "cold" });
    }
    toast("已更新");
    render();
  } catch (e) { toast("失败：" + e.message, true); }
};

function listEditor(title, key, items, hint) {
  const arr = (items || []).map((x) => (typeof x === "string" ? x : x.text)).filter(Boolean);
  return `
    <div class="panel" data-key="${key}">
      <h3>${title} <span class="badge">${arr.length}</span></h3>
      <div class="items">
        ${arr.map((t) => `
          <div class="item"><div class="top">
            <input type="text" class="pin" value="${esc(t)}" style="flex:1;background:transparent;border:none;color:var(--tx);font-size:12.5px">
            <button class="sm danger" onclick="this.closest('.item').remove()">删</button>
          </div></div>`).join("")}
      </div>
      <div class="tools" style="margin-top:10px">
        <button class="sm" data-add>+ 加一条</button>
        <span style="font-size:10.5px;color:var(--dim2);align-self:center">${esc(hint || "")}</span>
      </div>
    </div>`;
}

window.savePersona = async () => {
  const payload = {
    name: $("#pname").value.trim(),
    pronoun: $("#ppron").value,
  };
  ["core", "speech", "pacts", "judgments", "traits"].forEach((k) => {
    const panel = main.querySelector(`.panel[data-key="${k}"]`);
    if (!panel) return;
    payload[k] = [...panel.querySelectorAll(".items input.pin")]
      .map((i) => i.value.trim()).filter(Boolean);
  });
  try {
    await post("/persona", payload);
    toast("人格已保存");
    render();
  } catch (e) { toast("失败：" + e.message, true); }
};

function slider(key, label, val, min, max, step, unit, hint) {
  return `
    <div class="field">
      <label>${label}<span class="val" id="v_${key}">${val}${unit}</span></label>
      <input type="range" id="p_${key}" min="${min}" max="${max}" step="${step}" value="${val}"
             oninput="document.getElementById('v_${key}').textContent=this.value+'${unit}'">
      <div class="hint">${hint}</div>
    </div>`;
}

window.saveParams = async () => {

    "budget_identity", "budget_semantic", "budget_episodic",
    "proactive_max_per_day", "proactive_quiet_start", "proactive_quiet_end",
    "loops_per_turn", "loop_cooldown_hours", "noise_archive_days"];

  keys.forEach((k) => {
    const el = $("#p_" + k);

    <div class="h1">备份</div>
    <div class="sub">单文件格式 · 一个 .tanbak 装下全部记忆、人格和参数</div>

    <div class="panel">
      <h3>导出</h3>
      <div style="font-size:12.5px;opacity:.6;line-height:1.9;margin-bottom:14px">
        导出内容包括：<b>全部记忆、Thread、人格、未闭合事项、参数</b><br>
        文件是单个 <code style="background:#0d1117;padding:1px 6px;border-radius:4px">.tanbak</code>
        二进制文件，可以直接拷 U 盘、发微信、传网盘。
      </div>
      <div class="tools">
        <button class="pri" onclick="doExport()">下载备份文件</button>
        <button onclick="doLocalBackup()">在本地存一份</button>

    </div>

    <div class="panel">
      <h3>导入</h3>
      <div style="font-size:12.5px;opacity:.6;line-height:1.9;margin-bottom:14px">
        选一个 <code style="background:#0d1117;padding:1px 6px;border-radius:4px">.tanbak</code>
        文件，会先让你确认里面的内容，再决定要不要覆盖。<br>
        <b>导入前会自动把当前的库备份到 backup/ 目录</b>，后悔了还能还原。
      </div>
      <input type="file" id="impFile" accept=".tanbak"
             style="display:none" onchange="doImport(this)">
      <div class="tools">
        <button class="pri" onclick="document.getElementById('impFile').click()">选择备份文件</button>
      </div>
      <div id="impInfo" style="margin-top:12px"></div>
    </div>

    <div class="panel">
      <h3>本地备份（${backups.length}）</h3>
      ${backups.length ? backups.slice(0, 10).map(b => `
        <div class="item">

            <div class="lh" style="background:var(--green)"></div>

window.doExport = async () => {
  try {
    const r = await fetch(API + "/export", { headers: authHeaders() });
    if (r.status === 401) { await askToken(); return window.doExport(); }
    if (!r.ok) { toast("导出失败：HTTP " + r.status, true); return; }
    const blob = await r.blob();
    const name = r.headers.get("X-Backup-Name") || "tan-backup.tanbak";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast("已下载 " + name);
  } catch (e) { toast("导出出错：" + e.message, true); }
};

window.doLocalBackup = async () => {
  try {
    const r = await post("/backup");
    toast("已存到 backup/ · " + (r.bytes / 1024).toFixed(1) + " KB");
    render();
  } catch (e) { toast("失败：" + e.message, true); }
};

window.doImport = async (input) => {
  const f = input.files && input.files[0];
  if (!f) return;
  const box = document.getElementById("impInfo");
  box.innerHTML = `<div style="font-size:12px;opacity:.6">读取中…</div>`;
  try {
    const buf = await f.arrayBuffer();
    const rp = await fetch(API + "/import/preview", { method: "POST", body: buf, headers: authHeaders() });
    const info = await rp.json();
    if (!info.ok) {
      box.innerHTML = `<div style="color:var(--red);font-size:12px">文件无效：${esc(info.error || "")}</div>`;
      return;
    }
    box.innerHTML = `
      <div style="padding:12px 14px;border-radius:9px;background:rgba(88,166,255,.08);
                  border:1px solid rgba(88,166,255,.25);font-size:12.5px;line-height:1.8">
        <div style="font-weight:600;margin-bottom:6px">这份备份里有什么</div>
        <div style="opacity:.75">${esc(info.summary)}</div>
        <div style="margin-top:12px">
          <button class="pri" onclick="confirmImport()">确认导入</button>
          <button onclick="document.getElementById('impInfo').innerHTML=''">取消</button>
        </div>
      </div>`;
    window.__pendingBackup = buf;
  } catch (e) {
    box.innerHTML = `<div style="color:var(--red);font-size:12px">出错：${esc(e.message)}</div>`;
  }
  input.value = "";
};

window.confirmImport = async () => {
  const buf = window.__pendingBackup;
  if (!buf) return;
  try {
    const r = await fetch(API + "/import", { method: "POST", body: buf, headers: authHeaders() });
    const res = await r.json();
    if (res.ok) {
      toast("已导入 · " + res.summary);
      document.getElementById("impInfo").innerHTML = "";
      window.__pendingBackup = null;
      render();
    } else {
      toast("导入失败：" + (res.error || ""), true);
    }
  } catch (e) { toast("出错：" + e.message, true); }
};

/* ============ 启动 ============ */
async function boot() {
  try {
    await render();
  } catch (e) {
    // 别静默失败——之前「点了没反应」就是因为异常被吞了
    console.error("[tan] 启动失败:", e);
    if (!window.__tanErrShown) {
      window.__tanErrShown = true;
      const d = document.createElement("div");
      d.style.cssText = "position:fixed;left:50%;top:24px;transform:translateX(-50%);" +
        "background:#3d1f1f;border:1px solid #f85149;color:#ffb3b3;padding:12px 20px;" +
        "border-radius:10px;font-size:13px;z-index:99999;max-width:80%";
      d.textContent = "加载失败：" + e.message + "（服务地址 " + API + "）";
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 8000);
    }
  }
}
boot();
setInterval(() => { if (view === "overview") render(); }, 10000);
