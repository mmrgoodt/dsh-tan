<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hippocampus · 神经元视图</title>
<style>
  *{box-sizing:border-box}
  html,body{
    height:100%;margin:0;overflow:hidden;background:#0b0f15;color:#c9d1d9;
    font:12px/1.5 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}

  /* ---------- 通用面板 ---------- */
  .panel{
    position:fixed;z-index:10;background:rgba(13,17,23,.78);
    border:1px solid rgba(48,54,61,.9);border-radius:10px;padding:10px 12px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);user-select:none;pointer-events:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }

  /* ---------- 左上统计 ---------- */
  #hud{left:14px;top:14px;min-width:190px}
  #hud .row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  #dot{width:7px;height:7px;border-radius:50%;background:#8b949e;color:#8b949e;
       box-shadow:0 0 8px currentColor;flex:0 0 auto;transition:background .2s,color .2s}
  #dot.on{background:#3fb950;color:#3fb950}
  #dot.off{background:#f85149;color:#f85149}
  #connText{font-size:11px;color:#8b949e}
  .metrics{display:flex;gap:16px;margin:2px 0 7px}
  .metric b{display:block;font-size:19px;line-height:1.15;font-weight:600;color:#e6edf3;
            font-variant-numeric:tabular-nums}
  .metric span{font-size:10px;color:#6e7681;letter-spacing:.09em}
  #clock{font-size:11px;color:#7d8590;font-variant-numeric:tabular-nums;letter-spacing:.04em;
         border-top:1px solid rgba(48,54,61,.7);padding-top:6px}
  #statusLine{font-size:10.5px;color:#6e7681;margin-top:4px;min-height:14px}

  /* ---------- 左下图层图例 ---------- */
  #legend{left:14px;bottom:14px;display:flex;flex-direction:column;gap:5px}
  .leg{display:flex;align-items:center;gap:7px;font-size:11px;color:#9aa4b2;min-width:132px}
  .leg i{width:8px;height:8px;border-radius:50%;display:block;background:currentColor;
         box-shadow:0 0 7px currentColor;flex:0 0 auto}
  .leg b{margin-left:auto;color:#6e7681;font-weight:500;font-variant-numeric:tabular-nums}

  /* ---------- 悬停浮层 ---------- */
  #tip{
    position:fixed;z-index:20;max-width:340px;padding:9px 11px;border-radius:9px;
    background:rgba(13,17,23,.97);border:1px solid rgba(88,166,255,.28);
    box-shadow:0 12px 34px rgba(0,0,0,.65);font-size:12px;line-height:1.65;
    pointer-events:none;opacity:0;transform:translateY(4px);
    transition:opacity .12s ease,transform .12s ease;left:0;top:0;
  }
  #tip.show{opacity:1;transform:translateY(0)}
  #tip h4{margin:0 0 6px;font-size:12.5px;font-weight:600;color:#e6edf3;word-break:break-word}
  #tip .kv{display:flex;gap:8px;color:#8b949e}
  #tip .kv i{font-style:normal;color:#6e7681;min-width:46px;flex:0 0 auto}
  #tip .kv u{text-decoration:none;color:#c9d1d9;word-break:break-all}
  .badge{display:inline-block;padding:0 7px;border-radius:999px;font-size:10.5px;
         line-height:17px;border:1px solid currentColor;font-weight:500}

  /* ---------- 错误 / 离线提示 ---------- */
  #notice{
    position:fixed;left:50%;top:50%;z-index:30;width:min(560px,88vw);
    padding:18px 20px 16px;border-radius:12px;
    background:linear-gradient(180deg,rgba(22,27,34,.98),rgba(13,17,23,.98));
    border:1px solid rgba(248,81,73,.35);box-shadow:0 24px 70px rgba(0,0,0,.75);
    opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.985);
    transition:opacity .18s ease,transform .18s ease;
  }
  #notice.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #notice .t{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
             color:#f0f6fc;margin-bottom:9px;line-height:1.4}
  #notice .t em{width:9px;height:9px;border-radius:50%;background:#f85149;
                box-shadow:0 0 12px #f85149;font-style:normal;flex:0 0 auto}
  #notice p{margin:6px 0;color:#9aa4b2;font-size:12px;line-height:1.8}
  #notice code{background:rgba(110,118,129,.18);border:1px solid rgba(110,118,129,.25);
               border-radius:5px;padding:1px 5px;color:#79c0ff;
               font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:11.5px}
  #notice .btns{display:flex;gap:8px;margin-top:13px}
  #notice button{cursor:pointer;font:inherit;font-size:12px;padding:6px 13px;border-radius:7px;
                 background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.42);color:#79c0ff}
  #notice button:hover{background:rgba(88,166,255,.24)}
  #notice button.ghost{background:transparent;border-color:rgba(110,118,129,.42);color:#9aa4b2}
  #notice button.ghost:hover{background:rgba(110,118,129,.14)}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" class="panel">
  <div class="row"><span id="dot"></span><span id="connText">连接中…</span></div>
  <div class="metrics">
    <div class="metric"><b id="numNodes">0</b><span>节点</span></div>
    <div class="metric"><b id="numEdges">0</b><span>连接</span></div>
  </div>
  <div id="clock">--:--:--</div>
  <div id="statusLine"></div>
</div>

<div id="legend" class="panel"></div>
<div id="tip"></div>

<div id="notice" role="alert">
  <div class="t"><em></em><span id="noticeTitle">记忆服务未启动，请运行 python api.py</span></div>
  <div id="noticeBody"></div>
  <div class="btns">
    <button id="btnRetry" type="button">重试连接</button>
    <button id="btnFile" class="ghost" type="button">载入本地 graph.json</button>
  </div>
</div>
<input id="filePick" type="file" accept=".json,application/json" style="display:none">

<script>
(function () {
  'use strict';

  /* =========================================================
     0. 配置
     ========================================================= */

  // 接口地址：默认本地 18765，可用 ?api=http://127.0.0.1:PORT 覆盖
  var API_BASE = String((new URLSearchParams(location.search).get('api')) || 'http://127.0.0.1:18765')
    .replace(/\/+$/, '');
  var GRAPH_URL = API_BASE + '/graph';
  var STATUS_URL = API_BASE + '/status';
  var REFRESH_MS = 5000;      // 自动刷新周期
  var FETCH_TIMEOUT = 4000;   // 单次请求超时

  var LAYER_COLORS = {
    'L5': '#f5c850',
    'L4': '#f5c850',
    'L3': '#48c774',
    'L2': '#58a6ff',
    'L2-': '#f85149',
    'L1': '#d29922'
  };
  var UNKNOWN_COLOR = '#8b949e';
  var LEGEND = [
    { name: 'L4 / L5', layers: ['L4', 'L5'], color: '#f5c850' },
    { name: 'L3', layers: ['L3'], color: '#48c774' },
    { name: 'L2', layers: ['L2'], color: '#58a6ff' },
    { name: 'L2-', layers: ['L2-'], color: '#f85149' },
    { name: 'L1', layers: ['L1'], color: '#d29922' }
  ];

  // 半径 = 6 + weight*3（封顶 22）
  var R_BASE = 6, R_K = 3, R_MAX = 22;

  // 力导向参数（单位：像素 / 帧）
  var PHYS = {
    repulsion: 26000,   // 斥力强度
    soften: 220,        // d² 软化项，防除零爆炸
    cutoff: 1400,       // 斥力作用最大距离
    spring: 0.05,       // 弹簧系数
    springLen: 120,     // 弹簧静止长度
    gravity: 0.0016,    // 向质心的收拢力
    damping: 0.86,      // 速度阻尼
    maxSpeed: 24,       // 速度上限
    decay: 0.9935,      // 模拟温度衰减
    alphaMin: 0.002
  };

  var TAU = Math.PI * 2;

  /* =========================================================
     1. DOM
     ========================================================= */

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var elDot = document.getElementById('dot');
  var elConn = document.getElementById('connText');
  var elNodes = document.getElementById('numNodes');
  var elEdges = document.getElementById('numEdges');
  var elClock = document.getElementById('clock');
  var elStatus = document.getElementById('statusLine');
  var elLegend = document.getElementById('legend');
  var elTip = document.getElementById('tip');
  var elNotice = document.getElementById('notice');
  var elNoticeTitle = document.getElementById('noticeTitle');
  var elNoticeBody = document.getElementById('noticeBody');
  var btnRetry = document.getElementById('btnRetry');
  var btnFile = document.getElementById('btnFile');
  var filePick = document.getElementById('filePick');

  var W = 1, H = 1, DPR = 1;

  /* =========================================================
     2. 状态
     ========================================================= */

  var nodes = [];                 // 活动节点数组（含淡出中的）
  var edges = [];                 // 活动连线数组
  var nodeMap = new Map();        // id -> node
  var edgeMap = new Map();        // key -> edge
  var simAlpha = 1;              // 模拟温度
  var view = { x: 0, y: 0, scale: 1 };
  var hover = null;
  var drag = null;               // {mode:'node'|'pan', ...}
  var hasFramed = false;
  var failCount = 0;
  var corsBlocked = false;       // 探测结果：服务在跑但被浏览器跨域拦截
  var everLoaded = false;
  var online = false;
  var lastStatus = null;

  /* =========================================================
     3. 小工具
     ========================================================= */

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  var rgbCache = Object.create(null);
  function hexToRgb(hex) {
    var c = rgbCache[hex];
    if (c) return c;
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    c = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    rgbCache[hex] = c;
    return c;
  }
  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
  }
  function layerColor(layer) { return LAYER_COLORS[layer] || UNKNOWN_COLOR; }
  function nodeRadius(weight) {
    var w = Number(weight);
    if (!isFinite(w) || w < 0) w = 0;
    if (w > 8) w = 8;
    return Math.min(R_BASE + w * R_K, R_MAX);
  }

  /* =========================================================
     4. 相机 / 投影（手算屏幕坐标，保证线宽与文字始终 1:1 清晰）
     ========================================================= */

  function toScreen(x, y) {
    return {
      x: (x - view.x) * view.scale + W * 0.5,
      y: (y - view.y) * view.scale + H * 0.5
    };
  }
  function toWorld(sx, sy) {
    return {
      x: (sx - W * 0.5) / view.scale + view.x,
      y: (sy - H * 0.5) / view.scale + view.y
    };
  }
  function localPoint(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  /* =========================================================
     5. 布局
     ========================================================= */

  function spawn(node) {
    // 新节点在有邻居时贴着邻居出现，否则落在中心环上
    var near = null;
    for (var i = 0; i < edges.length; i++) {
      var e = edges[i];
      if (e.a === node || e.b === node) { near = (e.a === node ? e.b : e.a); break; }
    }
    if (near && isFinite(near.x) && isFinite(near.y)) {
      var ang = Math.random() * TAU, rad = 40 + Math.random() * 50;
      node.x = near.x + Math.cos(ang) * rad;
      node.y = near.y + Math.sin(ang) * rad;
    } else {
      var a2 = Math.random() * TAU, r2 = 130 + Math.random() * 190;
      node.x = Math.cos(a2) * r2;
      node.y = Math.sin(a2) * r2;
    }
    node.vx = 0;
    node.vy = 0;
  }

  function physics() {
    var n = nodes.length;
    if (n === 0) return;
    var i, j, a, b;

    // 质心
    var cx = 0, cy = 0;
    for (i = 0; i < n; i++) { cx += nodes[i].x; cy += nodes[i].y; }
    cx /= n; cy /= n;

    for (i = 0; i < n; i++) { nodes[i].fx = 0; nodes[i].fy = 0; }

    // 斥力：O(n²)，超过 cutoff 的距离直接忽略（约 1000 节点内 60fps）
    var cut2 = PHYS.cutoff * PHYS.cutoff;
    for (i = 0; i < n; i++) {
      a = nodes[i];
      for (j = i + 1; j < n; j++) {
        b = nodes[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > cut2) continue;
        if (d2 < 1) { dx = (Math.random() - 0.5) * 2; dy = (Math.random() - 0.5) * 2; d2 = dx * dx + dy * dy || 1; }
        var d = Math.sqrt(d2);
        var f = PHYS.repulsion / (d2 + PHYS.soften);
        var ux = dx / d * f, uy = dy / d * f;
        a.fx -= ux; a.fy -= uy;
        b.fx += ux; b.fy += uy;
      }
    }

    // 弹簧（连线）
    for (i = 0; i < edges.length; i++) {
      var e = edges[i];
      a = e.a; b = e.b;
      if (!a || !b || a === b) continue;
      var ex = b.x - a.x, ey = b.y - a.y;
      var ed = Math.sqrt(ex * ex + ey * ey) || 0.01;
      var diff = (ed - PHYS.springLen) * PHYS.spring;
      var kx = ex / ed * diff, ky = ey / ed * diff;
      a.fx += kx; a.fy += ky;
      b.fx -= kx; b.fy -= ky;
    }

    // 向质心收拢，避免整团飘走
    for (i = 0; i < n; i++) {
      a = nodes[i];
      a.fx += (cx - a.x) * PHYS.gravity;
      a.fy += (cy - a.y) * PHYS.gravity;
    }

    // 积分
    for (i = 0; i < n; i++) {
      a = nodes[i];
      if (a.pinned) { a.vx = 0; a.vy = 0; continue; }
      a.vx = (a.vx + a.fx * simAlpha) * PHYS.damping;
      a.vy = (a.vy + a.fy * simAlpha) * PHYS.damping;
      var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
      if (sp > PHYS.maxSpeed) { var s = PHYS.maxSpeed / sp; a.vx *= s; a.vy *= s; }
      a.x += a.vx;
      a.y += a.vy;
      if (!isFinite(a.x) || !isFinite(a.y)) {
        a.x = (Math.random() - 0.5) * 400;
        a.y = (Math.random() - 0.5) * 400;
        a.vx = 0; a.vy = 0;
      }
    }

    if (simAlpha > PHYS.alphaMin) simAlpha *= PHYS.decay;
    else simAlpha = 0;
  }

  function reheat(v) { simAlpha = Math.max(simAlpha, v || 0.8); }

  function fitView(animate) {
    var live = nodes.filter(function (a) { return a.target > 0; });
    if (!live.length) {
      view.x = 0; view.y = 0; view.scale = 1;
      return;
    }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < live.length; i++) {
      var a = live[i];
      if (a.x < minX) minX = a.x;
      if (a.y < minY) minY = a.y;
      if (a.x > maxX) maxX = a.x;
      if (a.y > maxY) maxY = a.y;
    }
    var pad = 120;
    var w = Math.max(maxX - minX + pad * 2, 320);
    var h = Math.max(maxY - minY + pad * 2, 320);
    var target = clamp(Math.min(W / w, H / h), 0.12, 2.2);
    var ncx = (minX + maxX) / 2, ncy = (minY + maxY) / 2;
    if (animate) {
      camTween = { x: ncx, y: ncy, s: target, t: 0 };
    } else {
      view.x = ncx; view.y = ncy; view.scale = target;
    }
  }

  var camTween = null;

  function updateCameraTween() {
    if (!camTween) return;
    camTween.t = Math.min(1, camTween.t + 0.08);
    var k = 1 - Math.pow(1 - camTween.t, 3);
    view.x += (camTween.x - view.x) * (k * 0.35 + 0.08);
    view.y += (camTween.y - view.y) * (k * 0.35 + 0.08);
    view.scale += (camTween.s - view.scale) * (k * 0.35 + 0.08);
    if (camTween.t >= 1) camTween = null;
  }

  /* =========================================================
     6. 数据接入
     ========================================================= */

  function readEdgeEndpoints(raw) {
    var s = raw.source_id !== undefined ? raw.source_id : (raw.source !== undefined ? raw.source : raw.from);
    var t = raw.target_id !== undefined ? raw.target_id : (raw.target !== undefined ? raw.target : raw.to);
    return { s: s, t: t };
  }

  function applyGraph(payload) {
    var data = payload && payload.data ? payload.data : payload;
    if (!data || typeof data !== 'object') return;
    var inNodes = Array.isArray(data.nodes) ? data.nodes : [];
    var inEdges = Array.isArray(data.edges) ? data.edges : [];

    var seen = new Set();
    var added = 0, changed = false;

    // --- 节点 ---
    for (var i = 0; i < inNodes.length; i++) {
      var raw = inNodes[i];
      if (!raw || raw.id === undefined || raw.id === null) continue;
      var id = String(raw.id);
      seen.add(id);
      var a = nodeMap.get(id);
      if (!a) {
        a = {
          id: id, x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 0,
          alpha: 0, target: 1, r: 6, pinned: false,
          layer: '', label: id, weight: 0, thread: null, age_days: 0,
          color: UNKNOWN_COLOR, cacheKey: '', cacheText: ''
        };
        spawn(a);
        nodeMap.set(id, a);
        nodes.push(a);
        added++;
        changed = true;
      }
      var layer = raw.layer != null ? String(raw.layer) : '';
      if (layer !== a.layer) { a.layer = layer; a.color = layerColor(layer); }
      var label = raw.label != null && raw.label !== '' ? String(raw.label) : id;
      if (label !== a.label) { a.label = label; a.cacheKey = ''; }
      a.weight = Number(raw.weight) || 0;
      a.thread = (raw.thread === undefined ? null : raw.thread);
      a.age_days = Number(raw.age_days) || 0;
      a.r = nodeRadius(a.weight);
      if (a.target !== 1) { a.target = 1; a.gone = false; }
      a.gone = false;
    }

    // 消失的节点：淡出
    for (var k = 0; k < nodes.length; k++) {
      if (!seen.has(nodes[k].id)) { nodes[k].target = 0; nodes[k].gone = true; }
    }

    // --- 连线 ---
    for (var m = 0; m < edges.length; m++) edges[m].target = 0;

    for (var q = 0; q < inEdges.length; q++) {
      var er = inEdges[q];
      if (!er) continue;
      var ends = readEdgeEndpoints(er);
      if (ends.s === undefined || ends.t === undefined || ends.s === null || ends.t === null) continue;
      var A = nodeMap.get(String(ends.s));
      var B = nodeMap.get(String(ends.t));
      if (!A || !B) continue;
      var type = er.edge_type != null ? String(er.edge_type) : '';
      var ekey = String(ends.s) + '\u0001' + String(ends.t) + '\u0001' + type;
      var e = edgeMap.get(ekey);
      if (!e) {
        e = { key: ekey, a: A, b: B, type: type, alpha: 0, target: 1 };
        edgeMap.set(ekey, e);
        edges.push(e);
      }
      e.a = A; e.b = B; e.type = type; e.target = 1;
    }

    // 清理彻底淡出的连线
    for (var z = edges.length - 1; z >= 0; z--) {
      var ed = edges[z];
      if (ed.target === 0 && ed.alpha <= 0.02) {
        edgeMap.delete(ed.key);
        edges.splice(z, 1);
      }
    }

    if (added > 0) reheat(0.9);
    if (changed && !hasFramed && seen.size > 0) {
      hasFramed = true;
      // 先给个初始视角，等布局开花后再自动 fit 一次
      setTimeout(function () { fitView(true); }, 900);
    }

    refreshHud();
    return { added: added, total: seen.size };
  }

  function refreshHud() {
    var liveN = 0, liveE = 0, byLayer = Object.create(null);
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      if (a.target > 0) {
        liveN++;
        byLayer[a.layer] = (byLayer[a.layer] || 0) + 1;
      }
    }
    for (var j = 0; j < edges.length; j++) if (edges[j].target > 0) liveE++;
    elNodes.textContent = String(liveN);
    elEdges.textContent = String(liveE);
    updateLegend(byLayer);
  }

  var legendRows = null;
  function buildLegend() {
    elLegend.textContent = '';
    legendRows = LEGEND.map(function (item) {
      var row = document.createElement('div');
      row.className = 'leg';
      row.style.color = item.color;
      var dot = document.createElement('i');
      var name = document.createElement('span');
      name.style.color = '#9aa4b2';
      name.textContent = item.name;
      var num = document.createElement('b');
      num.textContent = '0';
      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(num);
      elLegend.appendChild(row);
      return { item: item, num: num };
    });
  }

  function updateLegend(byLayer) {
    if (!legendRows) return;
    for (var i = 0; i < legendRows.length; i++) {
      var r = legendRows[i], sum = 0;
      for (var j = 0; j < r.item.layers.length; j++) sum += (byLayer[r.item.layers[j]] || 0);
      r.num.textContent = String(sum);
    }
  }

  /* =========================================================
     7. 渲染
     ========================================================= */

  function resize() {
    W = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    H = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function drawBackdrop() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0f15';
    ctx.fillRect(0, 0, W, H);

    // 中心微光
    var g = ctx.createRadialGradient(W * 0.5, H * 0.46, 0, W * 0.5, H * 0.46, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(88,166,255,0.055)');
    g.addColorStop(0.55, 'rgba(88,166,255,0.014)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 世界坐标点阵（跟随平移缩放）
    if (view.scale > 0.32) {
      var step = 90;
      var topLeft = toWorld(0, 0);
      var bottomRight = toWorld(W, H);
      var x0 = Math.floor(topLeft.x / step) * step;
      var y0 = Math.floor(topLeft.y / step) * step;
      var nx = Math.ceil((bottomRight.x - x0) / step) + 1;
      var ny = Math.ceil((bottomRight.y - y0) / step) + 1;
      if (nx * ny < 9000) {
        ctx.fillStyle = 'rgba(139,148,158,0.13)';
        var size = clamp(view.scale * 1.1, 0.7, 1.5);
        for (var ix = 0; ix < nx; ix++) {
          for (var iy = 0; iy < ny; iy++) {
            var p = toScreen(x0 + ix * step, y0 + iy * step);
            if (p.x < -4 || p.y < -4 || p.x > W + 4 || p.y > H + 4) continue;
            ctx.fillRect(p.x, p.y, size, size);
          }
        }
      }
    }
  }

  function drawEdges() {
    for (var i = 0; i < edges.length; i++) {
      var e = edges[i];
      if (!e.a || !e.b) continue;
      var alpha = e.alpha * Math.min(1, e.a.alpha + e.b.alpha);
      if (alpha <= 0.02) continue;

      var pa = toScreen(e.a.x, e.a.y);
      var pb = toScreen(e.b.x, e.b.y);
      if ((pa.x < -80 && pb.x < -80) || (pa.x > W + 80 && pb.x > W + 80)) continue;
      if ((pa.y < -80 && pb.y < -80) || (pa.y > H + 80 && pb.y > H + 80)) continue;

      var isThread = e.type === 'thread';
      var hot = (hover && (hover === e.a || hover === e.b));
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.lineWidth = isThread ? 1.15 : 1;
      ctx.strokeStyle = isThread
        ? 'rgba(88,166,255,' + (0.46 * alpha).toFixed(3) + ')'
        : 'rgba(139,148,158,' + (0.30 * alpha).toFixed(3) + ')';
      if (hot) ctx.strokeStyle = isThread
        ? 'rgba(121,192,255,' + (0.72 * alpha).toFixed(3) + ')'
        : 'rgba(201,209,217,' + (0.42 * alpha).toFixed(3) + ')';
      ctx.stroke();
    }
  }

  function drawNodes() {
    var i, a;

    // --- 外发光（叠加混合） ---
    var glow = [[2.35, 0.055], [1.72, 0.09], [1.26, 0.14]];
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < nodes.length; i++) {
      a = nodes[i];
      if (a.alpha <= 0.02) continue;
      var p = toScreen(a.x, a.y);
      var r = a.r * view.scale;
      if (r < 1.2) r = 1.2;
      if (p.x < -r * 4 || p.y < -r * 4 || p.x > W + r * 4 || p.y > H + r * 4) continue;
      for (var gi = 0; gi < glow.length; gi++) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * glow[gi][0], 0, TAU);
        ctx.fillStyle = rgba(a.color, glow[gi][1] * a.alpha);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    // --- 实心本体 ---
    for (i = 0; i < nodes.length; i++) {
      a = nodes[i];
      if (a.alpha <= 0.02) continue;
      var sp = toScreen(a.x, a.y);
      var rr = Math.max(a.r * view.scale, 1.1);
      if (sp.x < -rr * 4 || sp.y < -rr * 4 || sp.x > W + rr * 4 || sp.y > H + rr * 4) continue;

      ctx.beginPath();
      ctx.arc(sp.x, sp.y, rr, 0, TAU);
      ctx.fillStyle = rgba(a.color, 0.94 * a.alpha);
      ctx.fill();

      // 高光
      ctx.beginPath();
      ctx.arc(sp.x - rr * 0.28, sp.y - rr * 0.32, rr * 0.44, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.20 * a.alpha).toFixed(3) + ')';
      ctx.fill();

      // 边缘细环
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, rr, 0, TAU);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(240,246,252,' + (0.22 * a.alpha).toFixed(3) + ')';
      ctx.stroke();

      // 悬停高亮环
      if (a === hover) {
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, rr + 4.5, 0, TAU);
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = 'rgba(240,246,252,' + (0.55 * a.alpha).toFixed(3) + ')';
        ctx.stroke();
      }
    }
  }

  function truncateLabel(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    var ell = '…';
    var ellW = ctx.measureText(ell).width;
    if (ellW > maxWidth) return '';
    var lo = 0, hi = text.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(text.slice(0, mid)).width + ellW <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return lo <= 0 ? ell : text.slice(0, lo) + ell;
  }

  function drawLabels() {
    if (view.scale < 0.42) return;
    ctx.font = '11px "Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';

    var placed = [];   // 已放置标签的包围盒，用于避免文字互相压叠
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      if (a.alpha <= 0.15) continue;
      var p = toScreen(a.x, a.y);
      var r = Math.max(a.r * view.scale, 1.1);
      if (p.x < -160 || p.y < -40 || p.x > W + 160 || p.y > H + 40) continue;

      // 标签截断 + 宽度结果缓存（文字不变就不重复测量）
      if (a.cacheKey !== a.label) {
        a.cacheKey = a.label;
        a.cacheText = truncateLabel(a.label || a.id, 132);
        a.cacheW = a.cacheText ? ctx.measureText(a.cacheText).width : 0;
      }
      var txt = a.cacheText;
      if (!txt) continue;

      var lh = 13;
      var ty = p.y + r + 6;
      // 与已放标签重叠就往下让一行，最多让两行（不隐藏任何节点标签）
      for (var tries = 0; tries < 3; tries++) {
        var clash = false;
        for (var b = 0; b < placed.length; b++) {
          var box = placed[b];
          if (Math.abs(p.x - box.x) < (a.cacheW + box.w) * 0.5 + 3 &&
              ty < box.y + lh && ty + lh > box.y) { clash = true; break; }
        }
        if (!clash) break;
        ty += lh;
      }
      placed.push({ x: p.x, w: a.cacheW, y: ty });

      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(11,15,21,' + (0.92 * a.alpha).toFixed(3) + ')';
      ctx.strokeText(txt, p.x, ty);
      ctx.fillStyle = a === hover
        ? 'rgba(240,246,252,' + (0.98 * a.alpha).toFixed(3) + ')'
        : 'rgba(201,209,217,' + (0.86 * a.alpha).toFixed(3) + ')';
      ctx.fillText(txt, p.x, ty);
    }
  }

  function render() {
    drawBackdrop();
    drawEdges();
    drawNodes();
    drawLabels();
  }

  /* =========================================================
     8. 动画主循环
     ========================================================= */

  var lastTs = 0;
  function frame(ts) {
    // dt 夹在 [0,48]：标签页切回来时 rAF 时间戳可能跳变，负 dt 会让淡入系数变负
    var dt = lastTs ? clamp(ts - lastTs, 0, 48) : 16;
    lastTs = ts;

    updateCameraTween();

    // 视觉淡入淡出
    var k = 1 - Math.pow(1 - 0.14, dt / 16);
    for (var i = nodes.length - 1; i >= 0; i--) {
      var a = nodes[i];
      a.alpha += (a.target - a.alpha) * k;
      if (a.target === 0 && a.alpha <= 0.02) {
        nodeMap.delete(a.id);
        nodes.splice(i, 1);
        if (hover === a) { hover = null; hideTip(); }
      } else if (a.target === 1 && a.alpha > 0.995) {
        a.alpha = 1;
      }
    }
    for (var j = edges.length - 1; j >= 0; j--) {
      var e = edges[j];
      e.alpha += (e.target - e.alpha) * k;
      if (e.target === 0 && e.alpha <= 0.02) {
        edgeMap.delete(e.key);
        edges.splice(j, 1);
      }
    }

    if (simAlpha > 0 || nodes.length === 0) physics();

    render();
    requestAnimationFrame(frame);
  }

  /* =========================================================
     9. 交互
     ========================================================= */

  function pick(sx, sy) {
    var best = null, bestD = Infinity;
    for (var i = nodes.length - 1; i >= 0; i--) {
      var a = nodes[i];
      if (a.alpha < 0.2) continue;
      var p = toScreen(a.x, a.y);
      var r = Math.max(a.r * view.scale, 5) + 5;
      var dx = sx - p.x, dy = sy - p.y;
      var d2 = dx * dx + dy * dy;
      if (d2 <= r * r && d2 < bestD) { best = a; bestD = d2; }
    }
    return best;
  }

  function showTip(node, cx, cy) {
    var color = node.color;
    var html = '';
    html += '<h4>' + esc(node.label || node.id) + '</h4>';
    html += '<div class="kv"><i>图层</i><u><span class="badge" style="color:' + color + '">'
      + esc(node.layer || '?') + '</span></u></div>';
    html += '<div class="kv"><i>权重</i><u>' + fmt(node.weight, 2) + '</u></div>';
    html += '<div class="kv"><i>年龄</i><u>' + fmt(node.age_days, 1) + ' 天</u></div>';
    html += '<div class="kv"><i>线程</i><u>' + esc(node.thread === null || node.thread === undefined ? '—' : String(node.thread)) + '</u></div>';
    html += '<div class="kv"><i>ID</i><u style="font-family:ui-monospace,Consolas,monospace;font-size:11px">'
      + esc(node.id) + '</u></div>';
    elTip.innerHTML = html;
    elTip.classList.add('show');

    // 定位并夹在视口内
    var tw = elTip.offsetWidth || 260;
    var th = elTip.offsetHeight || 120;
    var x = cx + 16, y = cy + 16;
    if (x + tw > W - 10) x = Math.max(10, cx - tw - 16);
    if (y + th > H - 10) y = Math.max(10, cy - th - 16);
    elTip.style.left = x + 'px';
    elTip.style.top = y + 'px';
  }

  function hideTip() { elTip.classList.remove('show'); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(v, digits) {
    var n = Number(v);
    if (!isFinite(n)) n = 0;
    return n.toFixed(digits);
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = localPoint(e);
    var hit = pick(p.x, p.y);
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);

    if (hit) {
      var w = toWorld(p.x, p.y);
      drag = { mode: 'node', node: hit, dx: hit.x - w.x, dy: hit.y - w.y };
      hit.pinned = true;
      hit.vx = 0; hit.vy = 0;
      reheat(0.7);
      canvas.classList.add('dragging');
      hideTip();
    } else {
      drag = { mode: 'pan', sx: p.x, sy: p.y, vx: view.x, vy: view.y };
      canvas.classList.add('dragging');
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    var p = localPoint(e);

    if (drag) {
      if (drag.mode === 'node' && drag.node) {
        var w = toWorld(p.x, p.y);
        drag.node.x = w.x + drag.dx;
        drag.node.y = w.y + drag.dy;
        drag.node.vx = 0; drag.node.vy = 0;
        reheat(0.55);
      } else if (drag.mode === 'pan') {
        view.x = drag.vx - (p.x - drag.sx) / view.scale;
        view.y = drag.vy - (p.y - drag.sy) / view.scale;
        camTween = null;
      }
      return;
    }

    var hit = pick(p.x, p.y);
    if (hit !== hover) {
      hover = hit;
      if (hit) showTip(hit, p.x, p.y);
      else hideTip();
    } else if (hit) {
      showTip(hit, p.x, p.y);
    }
  });

  function endDrag(e) {
    if (!drag) return;
    if (drag.mode === 'node' && drag.node) {
      drag.node.pinned = false;
      reheat(0.45);
    }
    drag = null;
    canvas.classList.remove('dragging');
  }

  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function () {
    if (!drag) { hover = null; hideTip(); }
  });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = localPoint(e);
    var before = toWorld(p.x, p.y);
    var factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
    view.scale = clamp(view.scale * factor, 0.1, 5);
    var after = toWorld(p.x, p.y);
    view.x += before.x - after.x;
    view.y += before.y - after.y;
    camTween = null;
    if (hover) showTip(hover, p.x, p.y);
  }, { passive: false });

  canvas.addEventListener('dblclick', function (e) {
    if (!pick(localPoint(e).x, localPoint(e).y)) fitView(true);
  });

  window.addEventListener('resize', function () {
    resize();
  });

  /* =========================================================
     10. 数据拉取 / 容错
     ========================================================= */

  function getJSON(url, ms) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || FETCH_TIMEOUT);
    var p = fetch(url, {
      method: 'GET',
      cache: 'no-store',
      mode: 'cors',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
    return p.then(function (data) {
      clearTimeout(timer);
      return data;
    }, function (err) {
      clearTimeout(timer);
      throw err;
    });
  }

  function setOnline(on, label) {
    online = on;
    if (elDot.classList) {
      elDot.classList.toggle('on', on);
      elDot.classList.toggle('off', !on);
    }
    elConn.textContent = label || (on ? '已连接 · ' + API_BASE : '未连接');
  }

  function showNotice(mode, detail) {
    if (mode === 'cors') {
      elNoticeTitle.textContent = '浏览器拦截了跨域读取（服务其实在跑）';
      elNoticeBody.innerHTML =
        '<p>接口 <code>' + esc(API_BASE) + '</code> 可达，但 <code>api.py</code> 没有返回 ' +
        '<code>Access-Control-Allow-Origin</code>，浏览器因此拒绝把 JSON 交给页面。</p>' +
        '<p>解决办法（任选其一）：<br>' +
        '① 给 <code>api.py</code> 的 <code>json_resp()</code> 加一行 ' +
        '<code>handler.send_header("Access-Control-Allow-Origin", "*")</code>；<br>' +
        '② 在本页地址后加 <code>?api=http://127.0.0.1:PORT</code> 指向任意已开 CORS 的代理；<br>' +
        '③ 直接点下面「载入本地 graph.json」（先 <code>curl ' + esc(GRAPH_URL) +
        ' -o graph.json</code>）。</p>';
    } else {
      elNoticeTitle.textContent = '记忆服务未启动，请运行 python api.py';
      elNoticeBody.innerHTML =
        '<p>页面尝试读取 <code>' + esc(GRAPH_URL) + '</code> 失败' +
        (detail ? '（' + esc(detail) + '）' : '') + '。</p>' +
        '<p>启动方式：<br>' +
        '<code>cd D:\\dsh-tan</code><br>' +
        '<code>python api.py</code>（默认监听 18765）<br>' +
        '端口不同时用 <code>?api=http://127.0.0.1:端口</code> 打开本页。</p>';
    }
    elNotice.classList.add('show');
  }

  function hideNotice() { elNotice.classList.remove('show'); }

  function refresh() {
    if (document.hidden) return Promise.resolve();
    return getJSON(GRAPH_URL).then(function (data) {
      var r = applyGraph(data);
      everLoaded = true;
      failCount = 0;
      corsBlocked = false;
      hideNotice();
      setOnline(true, '已连接 · ' + API_BASE);
      // 顺带拿一次 /status 补充信息（失败不影响主流程）
      getJSON(STATUS_URL).then(function (st) {
        lastStatus = st;
        var bits = [];
        if (st && st.memories !== undefined) bits.push('memories ' + st.memories);
        if (st && st.threads !== undefined) bits.push('threads ' + st.threads);
        if (st && st.persona && st.persona.stage) bits.push(st.persona.stage);
        elStatus.textContent = bits.join(' · ');
      }, function () { /* 忽略 */ });
      if (!hasFramed && r && r.total > 0) { hasFramed = true; fitView(false); }
      return r;
    }, function (err) {
      failCount++;
      setOnline(false, '未连接 · ' + API_BASE);
      probeCors().then(function (blocked) {
        corsBlocked = blocked;
        if (blocked) showNotice('cors');
        else if (failCount >= 2 || !everLoaded) showNotice('down', err && err.message ? err.message : '网络错误');
        else elNotice.classList.remove('show');
      });
      return null;
    });
  }

  // 用 no-cors 探针区分「服务没起」和「服务起了但被 CORS 拦」
  function probeCors() {
    if (corsBlocked) return Promise.resolve(true);
    if (typeof fetch !== 'function') return Promise.resolve(false);
    return fetch(STATUS_URL, { mode: 'no-cors', cache: 'no-store' })
      .then(function () { return true; },
        function () { return false; });
  }

  /* =========================================================
     11. 本地 JSON 兜底（file:// 打不开接口时仍可看数据）
     ========================================================= */

  function ingestFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(String(rd.result));
        hasFramed = false;
        applyGraph(data);
        everLoaded = true;
        failCount = 0;
        hideNotice();
        setOnline(true, '本地文件 · ' + (file.name || 'graph.json'));
        fitView(false);
      } catch (err) {
        showNotice('down', 'JSON 解析失败');
      }
    };
    rd.readAsText(file, 'utf-8');
  }

  btnRetry.addEventListener('click', function () {
    hideNotice();
    setOnline(false, '重连中…');
    failCount = 0;
    refresh().then(function () { if (!everLoaded) showNotice('down'); });
  });

  btnFile.addEventListener('click', function () { if (filePick.click) filePick.click(); });
  filePick.addEventListener('change', function () {
    var f = filePick.files && filePick.files[0];
    if (f) ingestFile(f);
    filePick.value = '';
  });

  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) ingestFile(f);
  });

  /* =========================================================
     12. 时钟
     ========================================================= */

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function tickClock() {
    var d = new Date();
    elClock.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  /* =========================================================
     13. 启动
     ========================================================= */

  function boot() {
    buildLegend();
    resize();
    tickClock();
    setInterval(tickClock, 1000);

    requestAnimationFrame(frame);
    refresh();
    setInterval(function () { refresh(); }, REFRESH_MS);
  }

  // 调试 / 自动化验证入口（不影响正常使用）
  window.__HIPPO__ = {
    applyGraph: applyGraph,
    fitView: fitView,
    refresh: refresh,
    view: view,
    getNodes: function () { return nodes; },
    getEdges: function () { return edges; },
    pick: pick,
    toScreen: toScreen,
    toWorld: toWorld,
    urls: { graph: GRAPH_URL, status: STATUS_URL, base: API_BASE }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
