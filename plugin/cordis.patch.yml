# Tan 记忆插件
#
# 这一行是 bundle.patch：DSH 扫描 node_modules 时读到这里，自动把插件挂上。
# 注意：specifier 必须等于 package.json 的 name，且不要再在 profile 的
# cordis.patch.yml 里手动 insert 一遍（重复注册会让 client 端 entry 卡在 loading）。
- insert:
    - id: dsh-tan
      name: "dsh-tan"
      inject: []
      config:
        apiBase: "http://127.0.0.1:18765"
        root: "D:/dsh-tan"
        enabled: true
